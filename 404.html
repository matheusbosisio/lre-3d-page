<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LRE</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05070d;
      --surface:#0f1830;
      --line:#1c2a4a;
      --blue:#3ea7ff;
      --green:#3df7ac;
      --text:#eef2fb;
      --muted:#aab4cc;
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{
      min-height:100vh; margin:0; padding:24px;
      display:grid; place-items:center;
      color:var(--text); font-family:'Inter',sans-serif;
      background:
        radial-gradient(700px 380px at 80% 0%, rgba(62,167,255,.12), transparent 60%),
        radial-gradient(600px 340px at 0% 100%, rgba(61,247,172,.08), transparent 60%),
        var(--bg);
    }
    main{
      width:min(100%, 620px); padding:clamp(28px,7vw,56px);
      border:1px solid var(--line); border-radius:22px;
      background:linear-gradient(145deg, rgba(15,24,48,.96), rgba(10,18,48,.82));
      text-align:center; box-shadow:0 28px 70px rgba(0,0,0,.28);
    }
    .logo{width:96px; height:96px; object-fit:contain; margin:0 auto 18px;}
    .code{
      display:inline-block; margin-bottom:12px;
      color:var(--green); font:700 .82rem 'Space Grotesk',sans-serif;
      letter-spacing:.16em; text-transform:uppercase;
    }
    h1{margin:0; font:700 clamp(2rem,8vw,3.1rem)/1.08 'Space Grotesk',sans-serif;}
    p{max-width:46ch; margin:18px auto 30px; color:var(--muted); line-height:1.7;}
    .actions{display:flex; justify-content:center; gap:12px; flex-wrap:wrap;}
    a{
      min-height:46px; padding:12px 20px;
      display:inline-flex; align-items:center; justify-content:center;
      border-radius:10px; font-weight:700; text-decoration:none;
    }
    .primary{background:var(--green); color:#04140d;}
    .secondary{border:1px solid var(--line); color:var(--text);}
    a:focus-visible{outline:2px solid var(--blue); outline-offset:4px;}
    @media (max-width:480px){.actions a{width:100%;}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo-lre-3d.webp" width="384" height="384" alt="LRE 3D Criativo">
    <span class="code">Erro 404</span>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi alterado. Volte para a página inicial para conhecer nossos produtos e projetos personalizados em impressão 3D.</p>
    <div class="actions">
      <a class="primary" href="/">Voltar para o início</a>
      <a class="secondary" href="/sitemap.xml">Consultar o sitemap</a>
    </div>
  </main>
</body>
</html>
